services:
  - type: web
    name: overleaf-mcp-server
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: MCP_TRANSPORT
        value: streamable-http
      - key: OVERLEAF_HEADLESS
        value: "true"
      - key: OVERLEAF_STORAGE_STATE_B64
        sync: false
      - key: OVERLEAF_SHARE_URL
        sync: false
      - key: OVERLEAF_SESSION_COOKIE
        sync: false
